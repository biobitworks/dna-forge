name: judge-dashboard-attestation
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test harness
        run: python -m pip install --disable-pip-version-check pytest
      - name: Deterministic dashboard replay
        run: |
          python scripts/build_judge_lomo_heatmap.py
          python scripts/dashboard_merkle.py --check
      - name: Verify signed binary Merkle snapshot
        run: python scripts/verify_dashboard_attestation.py
      - name: Dashboard and licensing gates
        run: python -m pytest -q tests/test_judge_heatmap.py tests/test_team_license_dashboard.py tests/test_postkey_team_audit.py
      - name: No challenge rows/keys in Git
        run: python scripts/check_no_data.py
